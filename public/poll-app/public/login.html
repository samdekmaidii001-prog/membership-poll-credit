<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូលប្រើប្រាស់ប្រព័ន្ធ - Login</title>
    <style>
        body {
            font-family: 'Khmer OS Battambang', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        .login-card h2 {
            margin: 0 0 20px 0;
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-btn:hover {
            background-color: #0056b3;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            text-align: center;
            margin-bottom: 10px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>ចូលប្រើប្រាស់ប្រព័ន្ធ</h2>
        <div class="error-msg" id="error-message"></div>
        <form id="login-form">
            <div class="form-group">
                <label>ឈ្មោះគណនី (Username)</label>
                <input type="text" id="username" required placeholder="បញ្ចូលឈ្មោះរបស់អ្នក">
            </div>
            <div class="form-group">
                <label>លេខសម្ងាត់ (Password)</label>
                <input type="password" id="password" required placeholder="បញ្ចូលលេខសម្ងាត់">
            </div>
            <button type="submit" class="login-btn">ចូលប្រព័ន្ធ</button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const usernameInput = document.getElementById('username').value;
            const passwordInput = document.getElementById('password').value;
            const errorDiv = document.getElementById('error-message');

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: usernameInput, password: passwordInput })
                });

                const result = await response.json();

                if (result.success) {
                    // 📌 ពិនិត្យមើលតួនាទី (Role) ដើម្បីនាំផ្លូវទៅកាន់ទំព័រឱ្យបានត្រឹមត្រូវ
                    if (result.role === 'admin') {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/index.html';
                    }
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                console.error("Error logging in:", err);
                errorDiv.textContent = "មានបញ្ហាក្នុងការភ្ជាប់ទៅកាន់ Server!";
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
